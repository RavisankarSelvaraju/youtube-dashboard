<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ironhide-inspired brand seal: a wide-stanced mech with a rotary cannon arm">
  <defs>
    <linearGradient id="metal-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c3c9d1"/>
      <stop offset="45%" stop-color="#7b828d"/>
      <stop offset="100%" stop-color="#2c2f34"/>
    </linearGradient>
    <linearGradient id="metal-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#565c66"/>
      <stop offset="100%" stop-color="#24272c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a2e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3d47a"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1e2126"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- seal ring + disc -->
  <circle cx="100" cy="100" r="92" fill="url(#metal-body)" stroke="#08090a" stroke-width="2"/>
  <circle cx="100" cy="100" r="78" fill="url(#disc)"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#6a7078" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ground shadow -->
  <ellipse cx="100" cy="168" rx="46" ry="6" fill="#000" opacity="0.4"/>

  <!-- legs: wide planted stance, split with a visible gap -->
  <polygon points="90,140 72,140 50,166 76,166" fill="url(#metal-body)" stroke="#7d8592" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="110,140 128,140 150,166 124,166" fill="url(#metal-body)" stroke="#7d8592" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="60" cy="155" r="6" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1"/>
  <circle cx="140" cy="155" r="6" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1"/>

  <!-- hips: bridges torso to legs -->
  <polygon points="78,118 122,118 128,140 72,140" fill="url(#metal-body)" stroke="#7d8592" stroke-width="1" stroke-opacity="0.6"/>

  <!-- torso: broad shoulders tapering to waist -->
  <polygon points="78,118 56,80 100,58 144,80 122,118" fill="url(#metal-body)" stroke="#7d8592" stroke-width="1" stroke-opacity="0.6"/>

  <!-- right arm: single held cannon, lowered -->
  <g transform="rotate(14 152 104)">
    <rect x="144" y="94" width="18" height="38" rx="5" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1.2"/>
  </g>
  <circle cx="146" cy="134" r="9" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1.2"/>
  <circle cx="146" cy="134" r="4" fill="#101214"/>

  <!-- left arm: signature rotary cannon, raised and prominent, clearing the shoulder -->
  <g transform="rotate(-30 50 80)">
    <rect x="17" y="72" width="42" height="16" rx="4" fill="url(#metal-body)" stroke="#7d8592" stroke-width="1.2"/>
    <rect x="17" y="72" width="9" height="16" fill="#1a1c20"/>
  </g>
  <circle cx="21.4" cy="96.5" r="11" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1.5"/>
  <circle cx="21.4" cy="96.5" r="5" fill="#101214"/>
  <circle cx="21.7" cy="79.0" r="6.5" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1.2"/>
  <circle cx="21.7" cy="79.0" r="2.8" fill="#101214"/>

  <!-- shoulder pauldrons: tire-and-rim motif -->
  <g>
    <circle cx="50" cy="80" r="19" fill="#101214" stroke="url(#metal-body)" stroke-width="3.5"/>
    <circle cx="50" cy="80" r="11" fill="url(#metal-body)"/>
    <circle cx="50" cy="80" r="4" fill="#101214"/>
  </g>
  <g>
    <circle cx="150" cy="80" r="19" fill="#101214" stroke="url(#metal-body)" stroke-width="3.5"/>
    <circle cx="150" cy="80" r="11" fill="url(#metal-body)"/>
    <circle cx="150" cy="80" r="4" fill="#101214"/>
  </g>

  <!-- head: compact, sunk into the shoulders -->
  <polygon points="88,50 112,50 108,66 92,66" fill="url(#metal-dark)" stroke="#7d8592" stroke-width="1.2"/>
  <circle cx="94" cy="58" r="2.4" fill="url(#brass)" filter="url(#glow)"/>
  <circle cx="106" cy="58" r="2.4" fill="url(#brass)" filter="url(#glow)"/>

  <!-- weathering -->
  <g fill="#c7cbd1" fill-opacity="0.4">
    <circle cx="100" cy="64" r="1.6"/>
    <circle cx="88" cy="100" r="1.6"/>
    <circle cx="112" cy="100" r="1.6"/>
  </g>
</svg>
